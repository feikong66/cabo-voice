# Render Blueprint — CABO all-in-one (scoreboard + AI voice).
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# PLAN / MEMORY — read before changing `plan`:
#   Default VOICE_MODE=tts is a thin Edge TTS proxy: no torch, no model
#   weights. Measured steady state is ~70MB (73MB under 6 concurrent
#   requests), so the 512MB free plan is plenty.
#
#   Switching to VOICE_MODE=rvc changes everything: torch + HuBERT + one voice
#   model push steady state to 600-800MB, which means
#     free     (512MB) -> OOM, killed mid-request
#     starter  (512MB) -> same; paying does not add memory on this tier
#     standard (2GB)   -> the smallest plan that actually works
#   RVC also needs the image built with --build-arg VOICE_MODE=rvc, so flipping
#   the env var alone is not enough.
services:
  - type: web
    name: cabo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    dockerBuildArgs:
      VOICE_MODE: tts
    envVars:
      # tts = Edge TTS only (light). rvc = voice conversion (see note above).
      - key: VOICE_MODE
        value: tts
      # Default voices; any id from GET /voices works.
      - key: EDGE_VOICE_ZH
        value: zh-CN-YunjianNeural
      - key: EDGE_VOICE_EN
        value: en-US-AriaNeural
      # Slightly brisk delivery suits score callouts.
      - key: EDGE_RATE
        value: "+10%"
