# Cloud Build -> Cloud Run, for the CABO all-in-one image.
#
# Run it with:
#   gcloud builds submit --config cloudbuild.yaml .
# or let deploy-cloudrun.sh do the whole thing including API enablement.
#
# WHY CLOUD RUN: the image needs ~600-800MB RSS at steady state (torch + HuBERT
# + one voice). Render's 512MB tiers OOM; Cloud Run gives 2GiB and scales to
# zero, so an occasional card game stays inside the monthly free allowance.
#
# BUILD COST NOTE: this build installs CPU torch and downloads ~550MB of voice
# weights, so it takes roughly 15-25 minutes. The default machine is small, so
# we ask for a bigger one and a bigger disk — otherwise the docker layers for
# torch can fill the default 100GB-shared workspace on retries.

substitutions:
  _SERVICE: cabo
  _REGION: asia-east1        # Taiwan — lowest latency from mainland/HK phones
  _REPO: cabo                # Artifact Registry repository name
  _MODEL_ALLOW: "*"          # e.g. "nanami*" for a much smaller, faster image
  _INCLUDE_INDEX: "0"        # "1" bakes in .index files (bigger + more RAM)
  _MEMORY: 2Gi
  _CPU: "2"

# 60 minutes is the platform default; stated explicitly so a slow torch mirror
# cannot silently kill a build that is otherwise fine.
timeout: 3600s

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: "100"
  # Required when building with a user-specified service account, and harmless
  # otherwise: keeps logs in Cloud Logging instead of needing a GCS bucket.
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'

steps:
  # 1) Build. Tagged twice so :latest is easy to redeploy by hand.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--build-arg=MODEL_ALLOW=${_MODEL_ALLOW}'
      - '--build-arg=INCLUDE_INDEX=${_INCLUDE_INDEX}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '.'
    timeout: 3000s

  # 2) Push both tags before deploying.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}'

  # 3) Deploy.
  #    --concurrency 4  : inference is serialised behind a lock, so a high
  #                       concurrency just builds a queue that outlives the
  #                       request timeout.
  #    --timeout 300    : a cold instance must load HuBERT before the first
  #                       synthesis; the default 5 min covers it.
  #    --min-instances 0: scale to zero. Cold starts cost ~30-60s but idle time
  #                       is free. Set to 1 (with --no-cpu-throttling) if you
  #                       would rather pay to keep the voice instantly ready.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--timeout=300'
      - '--concurrency=4'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--cpu-boost'
      - '--set-env-vars=OMP_NUM_THREADS=2,RVC_F0_METHOD=rmvpe,RVC_WARMUP=1'
