# Cloud Build -> Cloud Run, for the CABO all-in-one image.
#
# Run it with:
#   gcloud builds submit --config cloudbuild.yaml .
# or let deploy-cloudrun.sh do the whole thing including API enablement.
#
# TWO MODES, very different resource profiles:
#
#   _VOICE_MODE=tts (default)
#     Thin Edge TTS proxy. No torch, no weights. ~70MB RSS, ~200MB image,
#     2-3 minute builds, 512MiB is plenty and cold starts are quick.
#
#   _VOICE_MODE=rvc
#     Adds torch + HuBERT + voice weights. ~600-800MB RSS, ~4GB image, 15-25
#     minute builds. Needs 2Gi and a low concurrency (inference is serialised
#     behind a lock, so extra concurrency only builds a queue that outlives the
#     request timeout). deploy-cloudrun.sh picks these numbers for you.

substitutions:
  _SERVICE: cabo
  _REGION: asia-east1        # Taiwan — lowest latency from mainland/HK phones
  _REPO: cabo                # Artifact Registry repository name
  _VOICE_MODE: tts           # "tts" (light, default) or "rvc" (heavy)
  _MODEL_ALLOW: "*"          # rvc only: e.g. "nanami*" for a smaller image
  _INCLUDE_INDEX: "0"        # rvc only: "1" bakes in .index files
  _MEMORY: 512Mi             # rvc needs 2Gi
  _CPU: "1"                  # rvc wants 2
  _CONCURRENCY: "20"         # rvc wants 4
  _EXTRA_ENV: ""             # appended to --set-env-vars, e.g. ",EDGE_RATE=+15%"

# 60 minutes is the platform default; stated explicitly so a slow torch mirror
# cannot silently kill an rvc build that is otherwise fine.
timeout: 3600s

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: "100"
  # Required when building with a user-specified service account, and harmless
  # otherwise: keeps logs in Cloud Logging instead of needing a GCS bucket.
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'

steps:
  # 1) Build. Tagged twice so :latest is easy to redeploy by hand.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--build-arg=VOICE_MODE=${_VOICE_MODE}'
      - '--build-arg=MODEL_ALLOW=${_MODEL_ALLOW}'
      - '--build-arg=INCLUDE_INDEX=${_INCLUDE_INDEX}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '.'
    timeout: 3000s

  # 2) Push both tags before deploying.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}'

  # 3) Deploy.
  #    --timeout 300    : generous. In tts mode a request is ~2s; in rvc mode a
  #                       cold instance must load HuBERT first.
  #    --min-instances 0: scale to zero — idle time is free. Set to 1 (with
  #                       --no-cpu-throttling) to pay for an always-warm voice.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--timeout=300'
      - '--concurrency=${_CONCURRENCY}'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--cpu-boost'
      - '--set-env-vars=VOICE_MODE=${_VOICE_MODE},OMP_NUM_THREADS=2${_EXTRA_ENV}'
